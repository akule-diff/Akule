name: CPU unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
      - name: Check contracts without model assets
        run: >-
          python -m pytest -q -m "not model_assets"
          tests/test_canonical_contract.py
          tests/test_common_strict_safety.py
          tests/test_release_io.py
          tests/test_smd_temporal_metrics.py
